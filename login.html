<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://opghwfuxrvjpbuxeykxn.supabase.co; font-src 'self'; connect-src 'self' https://opghwfuxrvjpbuxeykxn.supabase.co wss://opghwfuxrvjpbuxeykxn.supabase.co; media-src blob:; frame-src https://opghwfuxrvjpbuxeykxn.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="description" content="Iniciar sesión — Sistema de Gestión Logística">
<meta name="theme-color" content="#1a5276">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<title>Iniciar sesión – Sistema de Gestión Logística</title>
<link rel="stylesheet" href="css/panel.css?v=20260921d">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">📦</div>
      <h1>Sistema de Gestión Logística</h1>
      <p>Holding de empresas</p>
    </div>
    <form id="login-form" onsubmit="doLogin(event)">
      <div class="login-field">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" required placeholder="usuario@empresa.com" autocomplete="email">
      </div>
      <div class="login-field">
        <label for="login-pass">Contraseña</label>
        <div style="position:relative">
          <input type="password" id="login-pass" required placeholder="••••••••" autocomplete="current-password" style="padding-right:42px;width:100%;box-sizing:border-box">
          <button type="button" id="btn-toggle-pass" onclick="togglePass()" aria-label="Mostrar contraseña" title="Mostrar contraseña" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.05rem;padding:4px 6px;color:#4a5568;line-height:1">👁️</button>
        </div>
      </div>
      <div id="login-error" class="login-error"></div>
      <button type="submit" class="btn-login" id="btn-login">Iniciar sesión</button>
    </form>
    <div class="login-footer">
      <a href="#" onclick="doReset(event)">¿Olvidaste tu contraseña?</a>
    </div>
    <div id="reset-msg" class="reset-msg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/shared.js?v=20261023a"></script>
<script src="js/auth.js?v=20261021"></script>
<script>
async function doLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('btn-login');
  var errEl = document.getElementById('login-error');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Ingresando...';

  var email = document.getElementById('login-email').value.trim();
  var pass = document.getElementById('login-pass').value;

  var res = await _sb.auth.signInWithPassword({ email: email, password: pass });

  if (res.error) {
    errEl.textContent = res.error.message === 'Invalid login credentials'
      ? 'Correo o contraseña incorrectos'
      : res.error.message;
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
    return;
  }

  // Cuentas que no son del panel pero sí usuarias de una bodega satélite van a la app de bodegas
  // (en vez de que index.html les cierre la sesión por no tener fila en `usuarios`).
  btn.textContent = 'Verificando acceso...';
  if (await irABodegaSiAplica(res.data && res.data.user, email, pass)) return;

  location.replace('index.html');
}

// true si la cuenta NO tiene acceso al panel pero SÍ es usuaria activa de alguna bodega satélite: cierra la sesión
// del panel (solo esta, scope local), abre la de la app de bodegas (clave de sesión propia, igual que
// js/bodega-cliente.js) con las mismas credenciales y navega. Ante cualquier duda o error devuelve false y el
// flujo es el de siempre. Una cuenta del panel que además es de bodega (con fila activa en `usuarios`) entra al panel.
async function irABodegaSiAplica(user, email, pass) {
  try {
    if (!user) return false;
    // Misma consulta que js/auth.js para decidir si la cuenta es del panel.
    var p = await _sb.from('usuarios').select('id').eq('id', user.id).eq('activo', true).maybeSingle();
    if (p.error || p.data) return false;
    var c = await _sb.rpc('bodega_mi_contexto');
    if (c.error || !c.data || !c.data.usuario) return false;

    document.getElementById('btn-login').textContent = 'Entrando a Bodegas satélite...';
    // Local: no revoca otras sesiones de la cuenta (un signOut global cerraría también la de la bodega).
    try { await _sb.auth.signOut({ scope: 'local' }); } catch (e) {}
    // Desde aquí la sesión del panel ya no existe: si algo falla, el destino es el login de bodegas.
    var destino = 'bodega-login.html';
    try {
      var cb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'sb-bodega-auth' } });
      var r2 = await cb.auth.signInWithPassword({ email: email, password: pass });
      if (!r2.error) destino = 'bodega-satelite.html';
    } catch (e2) {}
    location.replace(destino);
    return true;
  } catch (e) {
    return false;
  }
}

function togglePass() {
  var inp = document.getElementById('login-pass');
  var btn = document.getElementById('btn-toggle-pass');
  var visible = inp.type === 'text';
  inp.type = visible ? 'password' : 'text';
  btn.textContent = visible ? '👁️' : '🙈';
  btn.title = visible ? 'Mostrar contraseña' : 'Ocultar contraseña';
  btn.setAttribute('aria-label', btn.title);
}

async function doReset(e) {
  e.preventDefault();
  var email = document.getElementById('login-email').value.trim();
  var msgEl = document.getElementById('reset-msg');
  if (!email) {
    msgEl.textContent = 'Ingresa tu correo electrónico primero';
    msgEl.className = 'reset-msg error';
    return;
  }
  var res = await _sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname.replace('login.html', 'recuperar.html')
  });
  if (res.error) {
    msgEl.textContent = res.error.message;
    msgEl.className = 'reset-msg error';
  } else {
    msgEl.textContent = 'Te enviamos un enlace a ' + email + '. Ábrelo para crear una contraseña nueva (caduca en 1 hora).';
    msgEl.className = 'reset-msg success';
  }
}
</script>
</body>
</html>
